<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
  #editor {
    height: 100%;
    overflow-y: auto;
  }
  .ProseMirror {
    padding: 12px 16px;
    outline: none;
    min-height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .ProseMirror p { margin: 0 0 0.5em 0; }
  .ProseMirror h1 { font-size: 1.8em; margin: 0.5em 0; }
  .ProseMirror h2 { font-size: 1.5em; margin: 0.5em 0; }
  .ProseMirror h3 { font-size: 1.3em; margin: 0.5em 0; }
  .ProseMirror h4 { font-size: 1.1em; margin: 0.5em 0; }
  .ProseMirror h5 { font-size: 1em; margin: 0.5em 0; }
  .ProseMirror h6 { font-size: 0.9em; margin: 0.5em 0; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; }
  .ProseMirror li { margin: 0.2em 0; }
  .ProseMirror blockquote {
    border-left: 3px solid #ccc;
    margin: 0.5em 0;
    padding-left: 1em;
    color: #555;
  }
  .ProseMirror code {
    background: #f0f0f0;
    padding: 0.1em 0.3em;
    border-radius: 3px;
    font-family: monospace;
    font-size: 0.9em;
  }
  .ProseMirror pre {
    background: #f5f5f5;
    padding: 0.8em;
    border-radius: 4px;
    overflow-x: auto;
  }
  .ProseMirror pre code { background: none; padding: 0; }
  .ProseMirror table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.5em 0;
  }
  .ProseMirror th, .ProseMirror td {
    border: 1px solid #ccc;
    padding: 4px 8px;
    text-align: left;
  }
  .ProseMirror th {
    background: #f5f5f5;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="editor"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="qrc:///frontend/prose.js"></script>
<script>
  ProseEditor.createEditor(document.getElementById('editor'));
</script>
</body>
</html>
